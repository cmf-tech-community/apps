<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- The app's own screen in small: a white route bending ahead of the car, the shaded chevron, and the
       progress arc along the bottom edge. -->
  <defs>
    <radialGradient id="face" cx="0.5" cy="0.38" r="0.62">
      <stop offset="0" stop-color="#26262B"/>
      <stop offset="1" stop-color="#060607"/>
    </radialGradient>
    <radialGradient id="sheen" cx="0.32" cy="0.18" r="0.75">
      <stop offset="0" stop-color="#fff" stop-opacity="0.14"/>
      <stop offset="0.6" stop-color="#fff" stop-opacity="0.02"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="48" cy="48" r="48" fill="url(#face)"/>
  <circle cx="48" cy="48" r="48" fill="url(#sheen)"/>
  <circle cx="48" cy="48" r="47.5" fill="none" stroke="#fff" stroke-opacity="0.14"/>
  <!-- progress: track, then the part already driven -->
  <path d="M20.4 75.6 A39 39 0 0 0 75.6 75.6" fill="none" stroke="#3A3A40" stroke-width="5.5" stroke-linecap="round"/>
  <path d="M20.4 75.6 A39 39 0 0 0 52 86.8" fill="none" stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round"/>
  <!-- the way behind, then the route ahead -->
  <path d="M48 72 V80" fill="none" stroke="#4A4A52" stroke-width="6" stroke-linecap="round"/>
  <path d="M48 56 V32 Q48 21 59 21 H73" fill="none" stroke="#FFFFFF" stroke-width="10"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- the car: a black rim, a lit left face, a shaded right face -->
  <path d="M48 45 L62 77 L48 70 L34 77 Z" fill="#000" stroke="#000" stroke-width="6" stroke-linejoin="round"/>
  <path d="M48 48.5 L48 68.5 L35.8 74.5 Z" fill="#FFFFFF"/>
  <path d="M48 48.5 L60.2 74.5 L48 68.5 Z" fill="#B2B4BA"/>
</svg>
