    <rect x="26" y="26" width="12" height="12" rx="3" fill="#ffffff" fill-opacity="0.14"/>
    <rect x="42" y="26" width="12" height="12" rx="3" fill="#ffffff" fill-opacity="0.14"/>
    <rect x="58" y="26" width="12" height="12" rx="3" fill="#ffffff" fill-opacity="0.55"/>
    <rect x="26" y="42" width="12" height="12" rx="3" fill="#ffffff" fill-opacity="0.30"/>
    <rect x="42" y="42" width="12" height="12" rx="3" fill="#ffffff"/>
    <rect x="58" y="42" width="12" height="12" rx="3" fill="#ffffff" fill-opacity="0.30"/>
    <rect x="26" y="58" width="12" height="12" rx="3" fill="#ffffff" fill-opacity="0.55"/>
    <rect x="42" y="58" width="12" height="12" rx="3" fill="#ffffff" fill-opacity="0.85"/>
    <rect x="58" y="58" width="12" height="12" rx="3" fill="#ffffff" fill-opacity="0.14"/>
  </g>
</svg>
