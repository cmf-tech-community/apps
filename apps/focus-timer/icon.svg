<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <rect width="96" height="96" rx="48" fill="#000000"/>
  <circle cx="48" cy="48" r="45.5" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="1"/>
  <!-- progress ring: three quarters lit -->
  <path d="M48 14 A34 34 0 1 1 24.8 72.4" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>
  <!-- the remaining quarter, dim -->
  <path d="M24.8 72.4 A34 34 0 0 1 48 14" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="7" stroke-linecap="round"/>
  <!-- hands: a tick to twelve and a short minute hand -->
  <rect x="45.5" y="30" width="5" height="20" rx="2.5" fill="#ffffff"/>
  <rect x="45.5" y="46" width="19" height="5" rx="2.5" fill="#ffffff"/>
  <circle cx="48" cy="48" r="4" fill="#ffffff"/>
</svg>
